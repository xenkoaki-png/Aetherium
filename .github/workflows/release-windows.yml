name: Build and Release Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-unity:
    name: Unity Windows Build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Create Unity build cache dirs
        run: |
          mkdir -p .unity-cache
          mkdir -p .unity-cache/Editor
          mkdir -p .unity-cache/Library

      - name: Unity Builder
        id: unity_builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.40f1
          targetPlatform: StandaloneWindows64
          buildName: Aetherium
          customParameters: -logFile /tmp/unity-build.log
          projectPath: .
          buildsPath: build

      - name: Zip Windows build
        run: |
          cd build/StandaloneWindows64
          zip -r ../Aetherium-Windows.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/Aetherium-Windows.zip
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetherium-Windows-Build
          path: build/Aetherium-Windows.zip
